# Read-only: shows the processing state of the latest App Store Connect builds.
name: iPhone build status
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      KEY_ID: 8Y4A9LM995
      ISSUER: cc498e55-a8b0-4e37-9913-2297be74303b
    steps:
      - name: Builds
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node - <<'JS'
          const c = require('crypto');
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'ES256', kid: process.env.KEY_ID, typ: 'JWT' });
          const body = b64({ iss: process.env.ISSUER, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' });
          const sig = c.sign('sha256', Buffer.from(head + '.' + body), { key: process.env.P8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          (async () => {
            const r = await fetch('https://api.appstoreconnect.apple.com/v1/builds?sort=-uploadedDate&limit=3&fields[builds]=version,processingState,uploadedDate,expired',
              { headers: { Authorization: `Bearer ${head}.${body}.${sig}` } });
            const j = await r.json();
            if (!r.ok) { console.log('status', r.status, JSON.stringify(j.errors)); process.exit(1); }
            for (const b of j.data) console.log(`build ${b.attributes.version}: ${b.attributes.processingState} (uploaded ${b.attributes.uploadedDate})`);
          })();
          JS
