# Builds the Reborn Rising iPhone app on GitHub's free Mac machine and sends it to TestFlight.
# Runs only when started by hand (Actions > iPhone to TestFlight > Run workflow).
# Everything secret comes from encrypted repository secrets, never from files in this public repo:
#   ASC_KEY_P8          App Store Connect API key (Admin role): the .p8 file's text
#   GOOGLE_SERVICE_INFO_PLIST                     Firebase iOS config file's text (GoogleService-Info.plist)
name: iPhone to TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version shown in the App Store (e.g. 1.0.0)
        default: "1.0.0"
permissions:
  contents: read
env:
  TEAM: PPK2ASTQX5          # REBORN RISING LLC (not secret)
  KEY_ID: 8Y4A9LM995       # App Store Connect API key id (not secret)
  ISSUER: cc498e55-a8b0-4e37-9913-2297be74303b    # App Store Connect issuer id (not secret)
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version
      - name: Install plugins
        run: npm ci
      - name: Firebase config and Google sign-in link
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s\n' "$GSI" > ios/App/App/GoogleService-Info.plist
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          sed -i '' "s#REVERSED_CLIENT_ID_PLACEHOLDER#$REV#" ios/App/App/Info.plist
      - name: Copy web files and install pods
        run: npx cap sync ios
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        run: |
          BUILD=$(( 100 + ${{ github.run_number }} ))
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="$BUILD" | xcpretty || exit ${PIPESTATUS[0]}
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Clean up keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ios/App/App/GoogleService-Info.plist
